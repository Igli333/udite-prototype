apiVersion: batch/v1
kind: Job
metadata:
  namespace: kafka
  name: kafka-topic-init
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: topic-init
          image: apache/kafka:4.1.1
          command:
            - /bin/bash
            - -c
            - |
              set -e
              
              echo "Waiting for Kafka to be ready"
              
              BOOTSTRAP="kafka.kafka.svc.cluster.local:9092"
              
              create_topic() {
                /opt/kafka/bin/kafka-topics.sh \
                --bootstrap-server $BOOTSTRAP \
                --topic $1 \
                --create \
                --if-not-exists \
                --partitions $2 \
                --replication-factor $3
              }
              
              create_topic traffic.sensors 12 1
              create_topic transport.sensors 12 1
              create_topic utilities.sensors 12 1
              create_topic environment.sensors 12 1
              create_topic telecom.sensors 12 1
              create_topic greeninfra.sensors 12 1
              
              
              # create_topic emergency.alerts 6 1
              # create_topic emergency.commands 6 1
              # create_topic system.health 6 1
              
              create_topic processed.data 6 1
              create_topic event.classifier 6 1
              
              /opt/kafka/bin/kafka-topics.sh \
                --bootstrap-server localhost:9092 \
                --create \
                --topic __consumer_offsets \
                --partitions 50 \
                --replication-factor 1 \
                --config cleanup.policy=compact
              
              echo "Kafka topics initialized."