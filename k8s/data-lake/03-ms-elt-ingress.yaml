apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: elt-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  rules:
    - host: elt.udite.com
      http:
        paths:
          - backend:
              service:
                name: ms-etl
                port:
                  number: 5002
            path: /
            pathType: Prefix